<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-blue-900 mb-6">Bienvenido de nuevo</h2>
        
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div class="[&>p>label]:block [&>p>label]:font-semibold [&>p>label]:mb-1 [&>p>input]:w-full [&>p>input]:border [&>p>input]:p-2 [&>p>input]:rounded">
                {{ form.as_p }}
            </div>
            
            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded shadow transition mt-4">
                Ingresar
            </button>
        </form>
        <p class="text-center mt-4 text-sm text-gray-600">¿Eres nuevo? <a href="{% url 'registro' %}" class="text-blue-600 font-semibold hover:underline">Crea una cuenta</a></p>
    </div>
</body>
</html>
