<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Cuenta</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-blue-900 mb-6">Únete a la comunidad</h2>
        
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <!-- Django renderiza los campos automáticamente aquí -->
            <div class="[&>p>label]:block [&>p>label]:font-semibold [&>p>label]:mb-1 [&>p>input]:w-full [&>p>input]:border [&>p>input]:p-2 [&>p>input]:rounded [&>p>span]:text-xs [&>p>span]:text-gray-500 [&>ul]:text-red-500 [&>ul]:text-xs">
                {{ form.as_p }}
            </div>
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded shadow transition mt-4">
                Registrarme
            </button>
        </form>
        <p class="text-center mt-4 text-sm text-gray-600">¿Ya tienes cuenta? <a href="{% url 'login' %}" class="text-blue-600 font-semibold hover:underline">Inicia sesión</a></p>
    </div>
</body>
</html>
